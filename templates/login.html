<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Agent Lens</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>:root{color-scheme:dark}body{margin:0;background:#0b1015;color:#e6edf3;font:15px/1.5 system-ui,sans-serif}.login{max-width:390px;margin:12vh auto;padding:24px;background:#131b23;border:1px solid #263442;border-radius:8px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.brand img{width:42px;height:42px}.brand strong{font-size:1.35rem}h1{font-size:1.2rem;margin:0 0 18px}form{display:grid;gap:12px}label{display:grid;gap:5px}input,button{background:#0b1015;color:#e6edf3;border:1px solid #263442;padding:10px;border-radius:5px}button{background:#174f3d;cursor:pointer}.error{color:#ffabab}</style>
</head><body><main class="login"><div class="brand"><img src="/assets/agent-lens-logo.png" alt="" width="42" height="42"><strong>Agent Lens</strong></div><h1>Sign in</h1>{% if failed %}<p class="error">Invalid username or password.</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="return_to" value="{{ return_to }}"><label>Username<input name="username" autocomplete="username" required maxlength="64" autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label><button type="submit">Sign in</button></form></main></body></html>
