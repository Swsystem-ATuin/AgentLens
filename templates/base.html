<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Agent Lens{% endblock %}</title>
<style>
:root{color-scheme:dark;--bg:#0b1015;--panel:#131b23;--line:#263442;--text:#e6edf3;--muted:#8da2b5;--accent:#63d3a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:var(--accent);text-decoration:none}h1{font-size:24px;margin:0 0 18px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th,.muted{color:var(--muted)}form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:5px}.message{background:var(--panel);border-left:3px solid var(--line);margin:12px 0;padding:0 14px}.message.assistant{border-color:var(--accent)}.message summary{cursor:pointer;padding:14px 0;list-style-position:outside}.message summary:hover{color:var(--accent)}.message-content{border-top:1px solid var(--line);padding:2px 0}.transcript-paragraph{white-space:pre-wrap;word-break:break-word;margin:12px 0;font:14px/1.5 ui-monospace,monospace}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-bottom:20px}
</style></head><body><header><a href="/sessions"><strong>Agent Lens</strong></a><span class="muted">local · read-only sources</span></header><main>{% block content %}{% endblock %}</main></body></html>
