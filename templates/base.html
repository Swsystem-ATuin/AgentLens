<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Agent Lens{% endblock %}</title>
<style>
:root{color-scheme:dark;--bg:#0b1015;--panel:#131b23;--line:#263442;--text:#e6edf3;--muted:#8da2b5;--accent:#63d3a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:var(--accent);text-decoration:none}h1{font-size:24px;margin:0 0 18px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th,.muted{color:var(--muted)}form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:5px}.pagination{display:flex;justify-content:center;gap:18px;margin:18px 0}.search-preview{display:inline-block;max-width:32rem;margin-top:.35rem;color:#ccc;font-size:.9rem;line-height:1.35}.search-preview mark{background:#735c00;color:#fff;padding:0 .08rem}.message{background:var(--panel);border-left:3px solid var(--line);margin:12px 0;padding:0 14px}.message.assistant{border-color:var(--accent)}.message summary{cursor:pointer;padding:14px 0;list-style-position:outside}.message summary:hover{color:var(--accent)}.message-content{border-top:1px solid var(--line);padding:2px 0}.transcript-paragraph{white-space:pre-wrap;word-break:break-word;margin:12px 0;font:14px/1.5 ui-monospace,monospace}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-bottom:20px}
.rich-text{overflow-wrap:anywhere}.rich-text>:first-child{margin-top:12px}.rich-text>:last-child{margin-bottom:12px}.rich-text h1{font-size:1.35rem}.rich-text h2{font-size:1.2rem}.rich-text h3,.rich-text h4,.rich-text h5,.rich-text h6{font-size:1.05rem}.rich-text pre{overflow:auto;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:5px}.rich-text code{font-family:ui-monospace,monospace}.rich-text :not(pre)>code{padding:1px 4px;background:var(--bg);border-radius:3px}.rich-text blockquote{margin-left:0;padding-left:14px;border-left:3px solid var(--line);color:var(--muted)}.rich-text table{display:block;overflow:auto;width:max-content;max-width:100%}.rich-text ul,.rich-text ol{padding-left:24px}
.message.tool{border-color:#c09aeb}.message.user-input{border-color:#ffbe6f}.timeline-state{display:inline-block;margin-left:8px;padding:1px 6px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:.8rem}.timeline-anchor{display:block;scroll-margin-top:12px}.timeline-content{position:relative;scroll-margin-top:12px}.timeline-content+.timeline-content{border-top:1px dashed var(--line)}.timeline-links{font-size:.85rem}.timeline-filter{margin-bottom:12px}
.message.turn{border-color:#6cb6ff}.message.diagnostic{border-color:#f0c674}.turn-model{display:flex;gap:8px;flex-wrap:wrap}.turn-model span{padding:2px 7px;border:1px solid var(--line);border-radius:10px}.diagnostic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.diagnostic-grid section{background:var(--panel);border:1px solid var(--line);padding:12px}
.usage-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.usage-cards div{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px}.usage-cards strong{font-size:1.25rem}.usage-cards small{color:var(--muted)}.site-nav{display:flex;gap:16px;align-items:center}.live-reader{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.live-reader label{color:var(--text)}[data-live-connection][data-state="connected"]{color:var(--accent)}[data-live-connection][data-state="disconnected"]{color:#ff8f8f}
</style></head><body><header><nav class="site-nav"><a href="/sessions"><strong>Agent Lens</strong></a><a href="/sessions">Sessions</a><a href="/usage">Usage</a><a href="/diagnostics">Diagnostics</a><a href="/health">Health</a><a href="/account">Account</a></nav><span class="muted">local · read-only sources</span></header><main>{% block content %}{% endblock %}</main></body></html>
