[package]
name = "agent-lens"
version = "0.1.0"
edition = "2024"
description = "Local, self-hosted observability for coding-agent activity"
repository = "https://git.s4w.uk/infrastructure/agent-lens.git"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
argon2 = "0.5"
askama = "0.14"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
chrono = "0.4"
chrono-tz = "0.10"
chacha20poly1305 = "0.10.1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
openidconnect = { version = "4.0.1", default-features = false }
password-hash = { version = "0.5", features = ["getrandom"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
  "html",
] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "fs",
  "sync",
] }
tower-http = { version = "0.6", features = ["trace"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
totp-rs = { version = "5.7", features = ["otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
webauthn-rs = "0.5.5"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
openssl = "0.10"
sha2 = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = [
  "softpasskey",
] }
